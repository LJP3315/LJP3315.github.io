{% if site.data.music %}
{%- assign has_lrc = false -%}
{%- for song in site.data.music -%}
  {%- if song.lrc -%}{%- assign has_lrc = true -%}{%- endif -%}
{%- endfor -%}
<!-- ========= 全站悬浮音乐播放器（APlayer） ========= -->
<!-- 歌曲列表在 _data/music.yml 里维护；播放器可按住拖动，位置记在浏览器本地 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<div id="aplayer"></div>
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
(function () {
  if (typeof APlayer === 'undefined') return;

  var songs = [
  {%- for song in site.data.music %}
    {
      name: {{ song.name | default: "未知歌曲" | jsonify }},
      artist: {{ song.artist | default: "未知艺术家" | jsonify }},
      url: {{ song.url | relative_url | jsonify }},
      cover: {% if song.cover %}{{ song.cover | relative_url | jsonify }}{% else %}""{% endif %}{% if has_lrc %},
      lrc: {% if song.lrc %}{{ song.lrc | relative_url | jsonify }}{% else %}""{% endif %}{% endif %}
    }{% unless forloop.last %},{% endunless %}
  {%- endfor %}
  ];

  var ap = new APlayer({
    container: document.getElementById('aplayer'),
    fixed: true,          // 悬浮固定在页面上，位置可拖动
    mini: true,           // 默认收起成小圆钮，点击展开
    autoplay: false,      // 浏览器禁止带声音的自动播放，保持 false
    theme: '#b7daff',     // 主题色
    loop: 'all',          // all | one | none
    order: 'list',        // list | random
    preload: 'none',      // 不预下载音频，点击才加载（省流量）
    listFolded: true,     // 播放列表默认折叠
    {% if has_lrc %}lrcType: 3,{% endif %}
    audio: songs
  });

  /* ============ 跨页面记忆播放状态 ============ */
  /* PJAX 换页时播放器 DOM 不重建、音乐不断，无需处理；
     这里只负责「整页刷新 / 新开标签」时恢复上次的曲目、进度、是否在播。
     音量 APlayer 已内置持久化（localStorage: aplayer-setting），不重复处理。 */
  var STATE_KEY = 'ap-player-state';
  var stateTimer = null;
  var restoring = true;   // 恢复流程完成前不回写，防止把旧状态冲掉

  function saveState() {
    if (restoring) return;
    try {
      if (!ap || !ap.audio) return;
      localStorage.setItem(STATE_KEY, JSON.stringify({
        i: ap.list.index || 0,              // 当前曲目序号
        t: Math.floor(ap.audio.currentTime || 0),  // 播放进度（秒）
        p: ap.audio.paused ? 0 : 1          // 是否正在播放
      }));
    } catch (err) {}
  }

  // timeupdate 触发很频繁（约 4 次/秒），节流到 3 秒存一次
  ap.on('timeupdate', function () {
    if (stateTimer) return;
    stateTimer = setTimeout(function () { stateTimer = null; saveState(); }, 3000);
  });
  ap.on('play', saveState);
  ap.on('pause', saveState);
  ap.on('listswitch', saveState);              // 切歌立即记下曲目
  window.addEventListener('pagehide', saveState);  // 关页/刷新前兜底存一次

  // —— 恢复上次状态 ——
  (function restore() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (err) {}
    function finish() { restoring = false; saveState(); }

    var count = (ap.list.audios || []).length;
    if (!s || typeof s.i !== 'number' || s.i < 0 || !count) { restoring = false; return; }

    var index = Math.min(s.i, count - 1);      // 歌单变短时收敛到范围内
    var wantTime = Math.max(0, Math.floor(s.t || 0));
    var wantPlay = !!s.p;

    if (index > 0) ap.list.switch(index);      // 切到上次那首（不会自动开播）

    // seek 必须等音频元数据加载（duration > 0）才有效；preload:'none' 时
    // 只有真正 play() 才会加载，然后才触发 loadedmetadata / canplay
    function seekOnce() {
      var dur = ap.audio.duration || 0;
      if (!dur || !isFinite(dur)) return;      // 元数据未就绪，等下一次事件
      ap.audio.removeEventListener('loadedmetadata', seekOnce);
      ap.audio.removeEventListener('canplay', seekOnce);
      if (wantTime > 3 && wantTime < dur - 3) ap.seek(wantTime);
      finish();
    }
    ap.audio.addEventListener('loadedmetadata', seekOnce);
    ap.audio.addEventListener('canplay', seekOnce);

    if (wantPlay) {
      // 若被浏览器自动播放策略拦下，APlayer 内部会把 UI 同步回暂停态，
      // 之后用户手动点播放时上面的事件仍会把进度补上
      ap.play();
    }
    setTimeout(finish, 4000);                  // 兜底：无论加载与否 4 秒后恢复记录
  })();

  /* ============ 悬浮播放器：按住拖动 + 位置记忆 ============ */
  var ROOT = document.documentElement;
  ROOT.classList.add('has-music-player');   // 供移动端浮动目录按钮上移避让
  var container = document.getElementById('aplayer');
  if (!container) return;

  var EDGE = 12;                       // 与视口边缘保留的最小间距（px）
  var KEY = 'ap-player-position';      // 位置记忆的 localStorage 键
  var bodyEl = container.querySelector('.aplayer-body');
  var switcher = container.querySelector('.aplayer-miniswitcher');
  var menuBtn = container.querySelector('.aplayer-icon-menu');
  var pos = null;                      // { x: 距视口左边, y: 距视口下边 }，单位 px
  var drag = null;                     // 拖拽过程的状态
  var guardUntil = 0;                  // 拖动刚结束时，吞掉紧随其后的那次 click

  function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  }

  // 面板宽度与播放条同步（展开/收起播放条时宽度会变：66px ↔ 约 400px）
  function syncWidth() {
    var w = Math.round(bodyEl.offsetWidth);
    if (w) container.style.setProperty('--ap-w', w + 'px');
  }

  // 整个悬浮块（播放条 + 可能展开的播放列表）的尺寸，用来限制不跑出视口
  function widgetSize() {
    return {
      w: Math.max(container.offsetWidth, bodyEl.offsetWidth),
      h: Math.max(container.offsetHeight, bodyEl.offsetHeight)
    };
  }

  // 把 pos 换算成 CSS 变量并写回页面（含边界收敛）
  function apply() {
    if (!pos) return;
    var size = widgetSize();
    pos.x = clamp(pos.x, EDGE, Math.max(EDGE, window.innerWidth - size.w - EDGE));
    pos.y = clamp(pos.y, EDGE, Math.max(EDGE, window.innerHeight - size.h - EDGE));
    container.style.setProperty('--ap-left', Math.round(pos.x) + 'px');
    container.style.setProperty('--ap-bottom', Math.round(pos.y) + 'px');
    ROOT.classList.add('ap-positioned');
  }

  function save() {
    if (!pos) return;
    try {
      localStorage.setItem(KEY, JSON.stringify({ x: pos.x, y: pos.y }));
    } catch (err) {}
  }

  // 决定这次按下算不算「抓取」：
  //   右侧开关条 —— 一律可拖
  //   播放列表 —— 留给滚动和点歌
  //   进度条/音量条/各种图标按钮 —— 是控件，不拖
  //   播放条其余空白（专辑封面、标题区）—— 可拖；单击仍照常播放/暂停
  function isHandle(node) {
    if (!node || !node.closest) return false;
    if (node.closest('.aplayer-miniswitcher')) return true;
    if (node.closest('.aplayer-list')) return false;
    if (node.closest('.aplayer-icon, .aplayer-bar-wrap, .aplayer-volume-wrap, button, a')) return false;
    return !!node.closest('.aplayer-body');
  }

  container.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!isHandle(e.target)) return;
    var rect = bodyEl.getBoundingClientRect();
    drag = {
      id: e.pointerId,
      x0: e.clientX,
      y0: e.clientY,
      left0: rect.left,
      bottom0: window.innerHeight - rect.bottom,
      moved: false
    };
    if (e.target.setPointerCapture) {
      try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });

  window.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x0;
    var dy = e.clientY - drag.y0;
    if (!drag.moved) {
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;   // 手抖不算拖动
      drag.moved = true;                                  // 过了阈值，才真的开始拖
      ROOT.classList.add('ap-dragging');
      if (!pos) pos = { x: drag.left0, y: drag.bottom0 };  // 首次拖动：把默认落点换算成绝对坐标
    }
    pos.x = drag.left0 + dx;
    pos.y = drag.bottom0 - dy;
    apply();
    e.preventDefault();
  }, { passive: false });

  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var moved = drag.moved;
    drag = null;
    ROOT.classList.remove('ap-dragging');
    if (moved) {
      guardUntil = Date.now() + 350;
      save();
    }
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  // 捕获阶段拦掉「拖动之后紧跟的那次 click」，否则松手会被当成点击→误触发播放/收起
  document.addEventListener('click', function (e) {
    if (Date.now() > guardUntil) return;
    if (!e.target.closest || !e.target.closest('#aplayer')) return;
    e.stopPropagation();
    e.preventDefault();
  }, true);

  // 展开/收起播放条、播放列表后尺寸都会变，等过渡动画结束后重新收敛一次边界
  function relayout(delay) {
    setTimeout(function () {
      syncWidth();
      if (pos) apply();
    }, delay);
  }
  if (switcher) switcher.addEventListener('click', function () { relayout(360); });
  if (menuBtn) menuBtn.addEventListener('click', function () { relayout(560); });
  window.addEventListener('resize', function () {
    syncWidth();
    if (pos) apply();
  });
  window.addEventListener('orientationchange', function () { relayout(300); });

  if (switcher) {
    var switcherBtn = switcher.querySelector('button');
    if (switcherBtn) switcherBtn.title = '点击展开/收起，按住可拖动';
  }

  // 恢复上次拖到的位置（换页面、刷新都记得）
  syncWidth();
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
      pos = { x: saved.x, y: saved.y };
      apply();
    }
  } catch (err) {}
})();
</script>

<script>
/* ============ PJAX：站内换页不重建播放器，音乐不断 ============ */
/* #footer（含 #aplayer）在 _layouts/default.html 里位于 .initial-content 之外，
   只替换 .initial-content 就能保住播放器 DOM，<audio> 不重建、音乐不断。
   换页后必须手动补做：①MathJax 按页加载 ②主题 _main.js 的一次性初始化
   ③侧边栏按钮重绑（window.wbSyncSidebarToggle）。
   history 操作一律 try 保护，异常或请求失败回落整页跳转。 */
(function () {
  if (!window.history || !window.fetch || !window.DOMParser) return;

  var CONTAINER = '.initial-content';
  var busy = false;
  var scrollMem = {};   // 每个 URL 的滚动位置，供「后退」时恢复

  function sameOrigin(href) {
    try {
      return new URL(href, location.href).origin === location.origin;
    } catch (err) { return false; }
  }

  function shouldHandle(e, link) {
    if (e.defaultPrevented || e.button !== 0) return false;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return false;
    if (!link) return false;
    var href = link.getAttribute('href');
    if (!href || href.charAt(0) === '#') return false;
    if (link.target && link.target !== '_self') return false;
    if (link.hasAttribute('download')) return false;
    if (/^(mailto:|tel:|javascript:)/i.test(href)) return false;
    if (!sameOrigin(href)) return false;
    if (link.closest('[data-no-pjax]')) return false;
    return true;
  }

  /* —— 换页后的补偿初始化 —— */
  function reInit(root, hasMath) {
    // ① MathJax：它是按 page.mathjax 逐页加载的；新页面有公式而当前页没加载过
    //    loader 时，现场注入配置 + loader，加载完再排版
    if (hasMath) {
      if (window.MathJax && window.MathJax.startup) {
        MathJax.typesetPromise([root]).catch(function () {});
      } else if (!document.querySelector('script[src*="mathjax"]')) {
        var cfg = document.createElement('script');
        cfg.text = 'MathJax = { tex: { inlineMath: [["$", "$"], ["\\\\(", "\\\\)"]],'
                 + ' displayMath: [["$$", "$$"], ["\\\\[", "\\\\]"]], processEscapes: true },'
                 + ' options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] } };';
        document.head.appendChild(cfg);
        var loader = document.createElement('script');
        loader.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
        loader.async = true;
        loader.onload = function () {
          try {
            if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([root]).catch(function () {});
          } catch (err) {}
        };
        document.head.appendChild(loader);
      }
    }

    // ② 主题 _main.js 的一次性初始化（jQuery 主题自带）
    if (window.jQuery) {
      var $ = window.jQuery;
      try { $('#main').fitVids(); } catch (err) {}
      // 图片灯箱：只给没绑定过的链接绑定（data-wb-lb 打标），避免重复叠加
      try {
        var $fresh = $('a[href$=".jpg"],a[href$=".jpeg"],a[href$=".JPG"],a[href$=".png"],'
                     + 'a[href$=".gif"],a[href$=".webp"]').has('> img').not('[data-wb-lb]');
        $fresh.addClass('image-popup').attr('data-wb-lb', '1');
        $fresh.magnificPopup({
          type: 'image',
          tLoading: 'Loading image #%curr%...',
          gallery: { enabled: true, navigateByImgClick: true, preload: [0, 1] },
          image: { tError: '<a href="%url%">Image #%curr%</a> could not be loaded.' },
          removalDelay: 500,
          mainClass: 'mfp-zoom-in',
          callbacks: {
            beforeOpen: function () {
              this.st.image.markup = this.st.image.markup.replace('mfp-figure', 'mfp-figure mfp-with-anim');
            }
          },
          closeOnContentClick: true,
          midClick: true
        });
      } catch (err) {}
    }

    // ③ 标题锚点（.header-link）
    try {
      root.querySelectorAll('.page__content h1, .page__content h2, .page__content h3,'
        + ' .page__content h4, .page__content h5, .page__content h6').forEach(function (el) {
        var id = el.getAttribute('id');
        if (!id) return;
        var anchor = document.createElement('a');
        anchor.className = 'header-link';
        anchor.href = '#' + id;
        anchor.innerHTML = '<span class="sr-only">Permalink</span><i class="fas fa-link"></i>';
        anchor.title = 'Permalink';
        el.appendChild(anchor);
      });
    } catch (err) {}

    // ④ 代码块复制按钮（与 _main.js 相同逻辑，自带幂等：已有按钮就跳过）
    if (window.enable_copy_code_button) {
      try {
        root.querySelectorAll('.page__content pre.highlight > code').forEach(function (code) {
          var pre = code.parentElement;
          if (!pre || (pre.firstElementChild && pre.firstElementChild.tagName.toLowerCase() !== 'code')) return;
          var btn = document.createElement('button');
          btn.title = 'Copy to clipboard';
          btn.className = 'clipboard-copy-button';
          btn.innerHTML = '<span class="sr-only">Copy code</span><i class="far fa-fw fa-copy"></i><i class="fas fa-fw fa-check copied"></i>';
          btn.addEventListener('click', function () {
            var target = code.querySelector('td.code, td.rouge-code') || code;
            var done = function () {
              btn.classList.add('copied');
              if (btn.interval) clearTimeout(btn.interval);
              btn.interval = setTimeout(function () {
                btn.classList.remove('copied');
                btn.interval = null;
              }, 1500);
            };
            if (navigator.clipboard) {
              navigator.clipboard.writeText(target.innerText).then(done, done);
            } else {
              done();
            }
          });
          pre.prepend(btn);
        });
      } catch (err) {}
    }

    // ⑤ 侧边栏折叠按钮重绑（#main 已被替换，旧监听器失效）
    if (typeof window.wbSyncSidebarToggle === 'function') {
      try { window.wbSyncSidebarToggle(); } catch (err) {}
    }

    // ⑥ 侧边栏「关注」按钮重绑
    //    主题 _main.js 里是 $(".author__urls-wrapper button").on("click", ...)，
    //    只在 document.ready 时给当时的 <button> 绑一次；PJAX 换页后侧边栏随
    //    .initial-content 一起被替换，新按钮身上没有任何监听器 → 手机上点了没反应。
    try { bindAuthorFollow(imported); } catch (err) {}
  }

  /* —— 抓取并替换 .initial-content —— */
  function navigate(url, push, scrollTo) {
    if (busy) return;
    busy = true;
    fetch(url, { credentials: 'same-origin', headers: { 'X-Requested-With': 'wb-pjax' } })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var fresh = doc.querySelector(CONTAINER);
        var stale = document.querySelector(CONTAINER);
        if (!fresh || !stale) throw new Error('container missing');
        var hasMath = !!doc.querySelector('script[src*="mathjax"]');

        var imported = document.importNode(fresh, true);
        stale.parentNode.replaceChild(imported, stale);
        if (doc.title) document.title = doc.title;
        // body 上带着每页不同的 layout--xxx / 自定义 classes，必须同步
        document.body.className = doc.body.className;

        // 关键：importNode 插入的 <script> 不会执行（浏览器规定），
        // 必须原地重建 script 元素才会运行——待办、时间轴、浮动目录
        // （toc-floating）都靠正文里的内联脚本渲染，不重放就是一片空白
        imported.querySelectorAll('script').forEach(function (old) {
          var type = old.getAttribute('type');
          if (type && type.toLowerCase() !== 'text/javascript') return;  // 跳过 ld+json 等数据块
          var s = document.createElement('script');
          if (old.src) {
            s.src = old.src;
            s.async = false;   // 外链脚本保持原有执行顺序
          } else {
            s.text = old.text;
          }
          old.parentNode.replaceChild(s, old);
        });

        try {
          if (push) history.pushState({ wb: 1 }, '', url);
        } catch (err) {
          location.href = url;   // history 异常回落整页跳转
          return;
        }

        window.scrollTo(0, typeof scrollTo === 'number' ? scrollTo : 0);
        reInit(imported, hasMath);
        busy = false;
      })
      .catch(function () {
        location.href = url;     // 请求/解析失败回落整页跳转
      });
  }

  /* —— 侧边栏「关注」按钮：自己绑一份，摆脱主题的一次性绑定 —— */
  /* 小屏（手机上）才有这个按钮，点它展开/收起社交链接列表。
     逻辑与主题保持一致：给 .author__urls 切 is--visible，给按钮切 open
     （open 会让按钮的 ::before 全屏遮罩接管点击，从而实现「点外面关闭」）。
     用 data-wb-follow 打标，重复调用不会叠加监听。 */
  function bindAuthorFollow(scope) {
    var btns = (scope || document).querySelectorAll('.author__urls-wrapper button');
    for (var i = 0; i < btns.length; i++) {
      (function (btn) {
        if (btn.getAttribute('data-wb-follow') === '1') return;
        btn.setAttribute('data-wb-follow', '1');
        btn.addEventListener('click', function () {
          var wrapper = btn.closest('.author__urls-wrapper');
          var urls = wrapper && wrapper.querySelector('.author__urls');
          if (!urls) return;
          var open = urls.classList.toggle('is--visible');
          btn.classList.toggle('open', open);
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      })(btns[i]);
    }
  }

  // 首屏不做任何事：那时的按钮由主题 _main.js 负责（整页加载时它是好的）。
  // 只有 PJAX 换页后新按钮没人管，所以在 reInit 里补绑，避免同一次点击被 toggle 两次。

  // 离开当前 URL 前记住滚动位置，后退回来时恢复
  function rememberScroll() {
    scrollMem[location.href] = window.scrollY;
  }

  document.addEventListener('click', function (e) {
    var link = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!shouldHandle(e, link)) return;
    e.preventDefault();
    rememberScroll();
    navigate(link.href, true);
  });

  window.addEventListener('popstate', function () {
    rememberScroll();   // 离开当前页前也记一份
    var target = typeof scrollMem[location.href] === 'number' ? scrollMem[location.href] : 0;
    navigate(location.href, false, target);
  });
})();
</script>

<!-- end custom footer snippets -->
