# ============================================================
# 全站悬浮音乐播放器（APlayer）配置
# ------------------------------------------------------------
# 每首歌一个条目，可以写多首，播放器会自动生成播放列表。
# 字段说明：
#   name    歌名（必填）
#   artist  歌手（可选）
#   url     音频文件路径（必填）—— 文件放到 assets/audio/ 目录下
#   cover   封面图路径（可选）—— 不写就显示默认封面
#   lrc     歌词文件路径（可选）—— .lrc 文件同样放 assets/audio/ 下
#
# 用法：把音频文件放进 assets/audio/ 目录，然后改这里或直接留用即可。
# 若暂时没有音频文件，把下面 —— 之间的条目全部注释掉，播放器就不会出现。
# ============================================================

- name: "歌曲名"
  artist: "歌手名"
  url: "/assets/audio/song.mp3"
  cover: ""
